# =====================================================================
# 운영 유사 풀스택: PostgreSQL + Redis + Kafka(KRaft) + 앱(dev) + 프론트(Nginx)
#   docker compose up --build
#
#   앱은 dev 프로파일 + Flyway로 뜨며, 거래 패턴 운영 구현이 활성화됩니다.
#     - 멱등/분산락 → Redis, 아웃박스 발행 → Kafka
#   (로컬 `mvn spring-boot:run`은 기본값 InMemory/Logging으로 동작하므로 Redis/Kafka 불필요)
# =====================================================================
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sk_sample
      POSTGRES_USER: sk
      POSTGRES_PASSWORD: sk_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sk -d sk_sample"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Kafka 단일 노드(KRaft 모드, Zookeeper 불필요)
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # DB
      DB_URL: jdbc:postgresql://postgres:5432/sk_sample
      DB_USER: sk
      DB_PASSWORD: sk_pass
      JWT_SECRET: sk-framework-jwt-hs512-secret-key-please-change-in-production-0123456789
      # Redis / Kafka 접속
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # 거래 패턴 운영 구현 활성화(memory/logging → redis/kafka)
      SK_FRAMEWORK_TRANSACTION_IDEMPOTENCY_STORE: redis
      SK_FRAMEWORK_TRANSACTION_LOCK_TYPE: redis
      SK_FRAMEWORK_TRANSACTION_OUTBOX_PUBLISHER: kafka
      MANAGEMENT_HEALTH_REDIS_ENABLED: "true"
    ports:
      - "8080:8080"

  # 프론트엔드(Nginx): 정적 서빙 + /api → app 프록시
  frontend:
    build:
      context: ./framework-frontend/user-admin
    depends_on:
      - app
    ports:
      - "5173:80"

volumes:
  pgdata:
