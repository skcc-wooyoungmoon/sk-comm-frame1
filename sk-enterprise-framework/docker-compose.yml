# =====================================================================
# 로컬 운영 유사 환경: PostgreSQL + 애플리케이션(dev 프로파일 + Flyway)
#   docker compose up --build
# =====================================================================
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sk_sample
      POSTGRES_USER: sk
      POSTGRES_PASSWORD: sk_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sk -d sk_sample"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/sk_sample
      DB_USER: sk
      DB_PASSWORD: sk_pass
      JWT_SECRET: sk-framework-jwt-hs512-secret-key-please-change-in-production-0123456789
    ports:
      - "8080:8080"

  # 프론트엔드(Nginx): 정적 서빙 + /api → app 프록시
  frontend:
    build:
      context: ./framework-frontend/user-admin
    depends_on:
      - app
    ports:
      - "5173:80"

  # ---------------------------------------------------------------
  # 운영 구현(Redis/Kafka) 전환 시 아래 서비스를 추가하고,
  # app 환경변수에 SPRING_DATA_REDIS_HOST=redis,
  # SK_FRAMEWORK_TRANSACTION_IDEMPOTENCY_STORE=redis 등을 주입하세요.
  # (샘플에는 redis/kafka 스타터가 없으므로 의존성 추가 필요 - 가이드 §7-1 참고)
  # ---------------------------------------------------------------
  # redis:
  #   image: redis:7-alpine
  #   ports: ["6379:6379"]

volumes:
  pgdata:
